# AI models AutoScene downloads on demand into the app data folder
# (`AppPaths::models()`). Every file is pinned by URL (immutable revision)
# and SHA256; `source` and `license` say where each comes from and on what
# terms (`non_commercial`: for non-commercial use only, which the app shows).

# Files of models a better one replaced: removed from the models folder at
# launch (`ModelStore::prune`). Nothing else there is ever deleted.
retired = ["arcface_w600k_r50.onnx"]

[[model]]
id = "transnetv2"
file = "transnetv2.onnx"
purpose = "Shot boundaries (hard cuts and gradual transitions)"
url = "https://huggingface.co/elya5/transnetv2/resolve/e1cfcb717af91e41ffb84b5fd851505682c576ee/transnetv2.onnx"
sha256 = "c4d54a682bace32f25136ef83ca2c9d403e8f8193775efeb995172a0d95a8e0c"
size = 31250929
license = "MIT"
source = "TransNetV2 (Souček & Lokoč), ONNX export of the original weights"

[[model]]
id = "scrfd-10g"
file = "scrfd_10g.onnx"
purpose = "Face detection with five landmarks (live action)"
url = "https://huggingface.co/immich-app/buffalo_l/resolve/d09715916a0778919a770c343533641e250b8699/detection/model.onnx"
sha256 = "5838f7fe053675b1c7a08b633df49e7af5495cee0493c7dcf6697200b85b5b91"
size = 16923827
license = "InsightFace non-commercial research"
non_commercial = true
source = "InsightFace buffalo_l det_10g (SCRFD-10G, Guo et al. 2021), byte-identical mirror by Immich"

# Chosen on bench/identity (Breaking Bad S01E01): tells people apart much
# better than buffalo_l's w600k_r50 — blurry faces most (AUC 0.886 vs 0.784)
# — and AdaFace IR-101 (tools/model-prep): main cast per-track F 0.925 vs
# 0.898, at ~30 % more face-pass time. Per screen time both are level.
[[model]]
id = "arcface-glintr100"
file = "arcface_glintr100.onnx"
purpose = "Face identity embeddings (live action)"
url = "https://huggingface.co/immich-app/antelopev2/resolve/51ca7e153bccebdbae224779e23c9c243e2fec85/recognition/model.onnx"
sha256 = "4ab1d6435d639628a6f3e5008dd4f929edf4c4124b1a7169e1048f9fef534cdf"
size = 260665334
license = "InsightFace non-commercial research"
non_commercial = true
source = "InsightFace antelopev2 glintr100 (ArcFace ResNet-100 on Glint360K), byte-identical mirror by Immich"

# Fast Scan (an optional mode for new projects): the face models of the
# Scener app's worker, byte-identical to the files it ships, from OpenCV
# Zoo. Faster and smaller than SCRFD-10G and glintr100, less sure.
[[model]]
id = "yunet-2023mar"
file = "face_detection_yunet_2023mar.onnx"
purpose = "Face detection with five landmarks (Fast Scan)"
url = "https://huggingface.co/opencv/face_detection_yunet/resolve/3cc26e7f1014a5ee5d74a42acee58bafc9d0a310/face_detection_yunet_2023mar.onnx"
sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
size = 232589
license = "MIT"
source = "OpenCV Zoo YuNet 2023mar (Wu et al. 2023), Hugging Face opencv/face_detection_yunet"

[[model]]
id = "sface-2021dec"
file = "face_recognition_sface_2021dec.onnx"
purpose = "Face identity embeddings (Fast Scan)"
url = "https://huggingface.co/opencv/face_recognition_sface/resolve/3d7082438a6e4551e840c9b2bb60b71e8da4b524/face_recognition_sface_2021dec.onnx"
sha256 = "0ba9fbfa01b5270c96627c4ef784da859931e02f04419c829e83484087c34e79"
size = 38696353
license = "Apache-2.0"
source = "OpenCV Zoo SFace 2021dec (Zhong et al. 2021), Hugging Face opencv/face_recognition_sface"

# Characters who face away (an optional mode, see bench/bodies): people and
# how they look. Both are files of InsightFace's cheetah_l package, a zip on
# its model-zoo release that holds face models too: each is fetched alone by
# the byte ranges the archive's directory gives, then checked by its own
# SHA256 (the archive may be repacked; the files may not change).
[[model]]
id = "person-ppyoloe"
file = "pp_det_med.onnx"
purpose = "People (whole bodies), to follow characters while their face doesn't show"
url = "https://github.com/deepinsight/insightface/releases/download/model-zoo/cheetah_l.zip"
member = "pp_det_med.onnx"
sha256 = "6e9842a1a0122a474765838780012a4e7553623578b460848e5d47e743e22801"
size = 29836627
license = "InsightFace non-commercial (cheetah_l-public-v1)"
non_commercial = true
source = "InsightFace cheetah_l pp_det_med: PaddleDetection PP-YOLOE pedestrian detector"

[[model]]
id = "person-reid-0277"
file = "reid_0265.onnx"
purpose = "How a person looks (clothes, build), to find them again without a face"
url = "https://github.com/deepinsight/insightface/releases/download/model-zoo/cheetah_l.zip"
member = "reid_0265.onnx"
sha256 = "c15084e7fa47e5ade8af236372e0c81d7d6a11d10d4f4db2d98b72ec6cefef0f"
size = 8440242
license = "InsightFace non-commercial (cheetah_l-public-v1)"
non_commercial = true
source = "InsightFace cheetah_l reid_0265: OpenVINO person-reidentification-retail-0277 (OmniScaleNet)"

# Anime characters (2D): deepghs detectors and a CCIP character-image
# embedder — the first config's models; the anime benchmark (bench/anime)
# may re-pick the detector size, which updates these rows. Heads are the
# trackable unit (anime faces are too often tiny, stylised or turned); the
# person detector only adds heads the head model missed.
# metadata_props: Ultralytics YOLOv8 8.0.196 export (author=Ultralytics,
# batch 1, imgsz 640, stride 32, task=detect, names={0:'head'}); stamped
# license=AGPL-3.0 by the exporter — see `terms`.
[[model]]
id = "anime-head-v2m"
file = "anime_head_detect_v2m.onnx"
purpose = "Head detection (anime characters)"
url = "https://huggingface.co/deepghs/anime_head_detection/resolve/06604feee81983792a57c21081e539c0ae229833/head_detect_v2.0_m/model.onnx"
sha256 = "2cecb8d89d38d8902b27d232ff3b69b30ce83d8621fa3f80940b89f5c412e3dd"
size = 103461826
license = "MIT"
card = "https://huggingface.co/deepghs/anime_head_detection"
terms = "Model card licenses the weights MIT. The ONNX was exported with Ultralytics, whose metadata stamps AGPL-3.0; that stamp describes the exporter, not the weights."
source = "deepghs anime_head_detection head_detect_v2.0_m (YOLOv8m, 79.1 GFLOPS)"

# metadata_props: names={0:'person'}, stride=32 — the graph carries no
# license or author stamps.
[[model]]
id = "anime-person-v1m"
file = "anime_person_detect_v1m.onnx"
purpose = "Whole-person detection (anime), to catch heads the head model misses"
url = "https://huggingface.co/deepghs/anime_person_detection/resolve/e39c744c22432ad01f91dd254fe2b02c8d878b8c/person_detect_v1.1_m/model.onnx"
sha256 = "c80365a98ca8388fd2f01fd5abea0439e92265bceceb048bef38b0849303467c"
size = 103459671
license = "MIT"
card = "https://huggingface.co/deepghs/anime_person_detection"
terms = "Model card licenses the weights MIT; the ONNX carries no license metadata."
source = "deepghs anime_person_detection person_detect_v1.1_m (YOLOv8m, 9.53k GFLOPS)"

# metadata_props: none — the graph carries no license or author stamps
# (pytorch 1.13.1 export, opset 14).
[[model]]
id = "anime-ccip-caformer24"
file = "anime_ccip_caformer24.onnx"
purpose = "Character identity embeddings (anime), 768-d CCIP vectors"
url = "https://huggingface.co/deepghs/ccip_onnx/resolve/eb2acdd29af1703388d3d0c04221add322bc9110/ccip-caformer-24-randaug-pruned/model_feat.onnx"
sha256 = "4ea118d16496274f4f6e08d3afc768cc592389e8f7f32f8732ce2215c228ac5f"
size = 150248245
license = "OpenRAIL"
card = "https://huggingface.co/deepghs/ccip_onnx"
terms = "The CCIP family ships under the Open Responsible AI License (OpenRAIL): use restrictions apply (no unlawful, harmful or rights-infringing use); commercial use is allowed under its terms."
source = "deepghs ccip_onnx ccip-caformer-24-randaug-pruned (CAFormer-24, character-image embedding)"
