[package]
name = "autoscene-app"
description = "AutoScene desktop app"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "autoscene-app"

[lib]
name = "autoscene_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoscene-app"
path = "src/main.rs"

# Dev tool that rewrites app/src/bindings.ts (`npm run bindings`). Behind a
# feature so the installers leave it out: `tauri build` bundles every bin of
# this crate except those whose required features are off.
[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"
required-features = ["export-bindings"]

[features]
export-bindings = []

[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.3", features = [] }

[dependencies]
as-core.workspace = true
as-api.workspace = true
as-engine.workspace = true
as-export.workspace = true
as-jobs.workspace = true
as-media.workspace = true
as-models.workspace = true
as-project.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio.workspace = true
log = "0.4.34"
# Bridge `tracing` events from library crates into tauri-plugin-log.
tracing = { workspace = true, features = ["log"] }
tauri = { version = "=3.0.0-alpha.4", features = ["protocol-asset"] }
tauri-runtime-wry = "=3.0.0-alpha.4"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-log = "=3.0.0-alpha.2"
tauri-plugin-opener = "=3.0.0-alpha.2"
tauri-plugin-clipboard-manager = "=3.0.0-alpha.2"
tauri-plugin-dialog = "=3.0.0-alpha.3"
tauri-plugin-updater = "=3.0.0-alpha.2"
tauri-plugin-single-instance = "=3.0.0-alpha.2"
tauri-plugin-window-state = "=3.0.0-alpha.2"

[target.'cfg(windows)'.dependencies]
# Keep the PC awake while analysis runs.
windows-sys = { version = "0.61.2", features = [
    "Win32_System_Power",
    # The Windows build, for Mica (window.rs).
    "Wdk_System_SystemServices",
    "Win32_System_SystemInformation",
] }
