[package]
name = "autoscene-app"
description = "AutoScene desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "autoscene-app"

[lib]
name = "autoscene_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autoscene-app"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
as-core.workspace = true
as-api.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
tokio.workspace = true
log = "0.4"
# Bridge `tracing` events from library crates into tauri-plugin-log.
tracing = { workspace = true, features = ["log"] }
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
