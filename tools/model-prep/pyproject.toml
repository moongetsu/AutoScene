[project]
name = "autoscene-model-prep"
version = "0.1.0"
description = "Dev-only: turn upstream face models into the ONNX graphs AutoScene runs (never shipped)."
requires-python = ">=3.14"
# Newest releases (pre-releases included), pinned exactly.
dependencies = [
    "torch==2.14.1",
    "safetensors==0.9.0rc1",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "numpy==2.5.4",
    "onnxscript==0.7.3.dev20261007",
]

[tool.uv]
package = false
prerelease = "allow"
