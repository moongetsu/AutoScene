[package]
name = "as-plugin"
description = "AutoScene plugins: what a plugin declares and how AutoScene checks it"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

# The tool plugin authors pack and sign with (`cargo install --path
# crates/as-plugin --features cli --bin asp`). Behind a feature, so the app
# doesn't build minisign's signing side and password prompt.
[[bin]]
name = "asp"
path = "src/bin/asp.rs"
required-features = ["cli"]

# A stand-in plugin for the runtime tests (tests/runtime.rs), never shipped.
[[bin]]
name = "asp_test_plugin"
path = "src/bin/asp_test_plugin.rs"
test = false
doc = false

[features]
cli = ["dep:minisign", "dep:tempfile"]

[dependencies]
as-core.workspace = true
as-api.workspace = true
as-db.workspace = true
as-media.workspace = true
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
thiserror.workspace = true
tracing.workspace = true
parking_lot.workspace = true
uuid.workspace = true
semver.workspace = true
sha2.workspace = true
zip.workspace = true
minisign-verify.workspace = true
base64.workspace = true
minisign = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
minisign.workspace = true
tempfile.workspace = true
# The store's tests make library.db refuse a write.
rusqlite.workspace = true
