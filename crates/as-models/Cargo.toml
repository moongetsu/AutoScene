[package]
name = "as-models"
description = "AutoScene AI model manifest and resumable, checksum-verified downloads"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
as-core.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
sha2.workspace = true
toml.workspace = true
ureq = "=3.4.2"
# Where a redirect leads: requests follow theirs themselves (see `get`).
url = "=2.5.8"
flate2 = "=1.1.10"

# The free space on the models folder's drive, before a download.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
