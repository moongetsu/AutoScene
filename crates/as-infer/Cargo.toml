[package]
name = "as-infer"
description = "AutoScene inference runtime: loads the bundled ONNX Runtime and picks the GPU execution provider"
version.workspace = true
edition.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
tracing.workspace = true
# One binary for every ONNX Runtime >= 1.24 (DirectML build 1.24.4, macOS 1.31),
# loaded from the app's own folder at runtime.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic", "api-24"] }

[target.'cfg(windows)'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["directml"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["coreml"] }
