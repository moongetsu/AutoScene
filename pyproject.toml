[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoscene"
version = "0.1.0"
description = "Local GPU character scene-pack creator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "python-multipart>=0.0.12",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.10.0",
  "pillow>=10.4.0",
  "hdbscan>=0.8.38",
  "scikit-learn>=1.5.0",
  "insightface>=0.7.3",
  # onnxruntime and onnxruntime-gpu conflict — keep them mutually exclusive.
  # macOS has no onnxruntime-gpu build at all; CoreML EP ships in the base wheel.
  "onnxruntime-gpu>=1.19.0; platform_system != 'Darwin'",
  "onnxruntime>=1.19.0; platform_system == 'Darwin'",
  "onnx>=1.16.0",
  "scenedetect>=0.6.4",
  "nvidia-cublas>=13.0.0; platform_system != 'Darwin'",
  "nvidia-cudnn-cu13>=9.0.0; platform_system != 'Darwin'",
  "nvidia-cuda-runtime>=13.0.0; platform_system != 'Darwin'",
  "nvidia-cuda-nvrtc>=13.0.0; platform_system != 'Darwin'",
  "nvidia-nvjitlink>=13.0.0; platform_system != 'Darwin'",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.3.0"]
deepface = ["deepface>=0.0.93", "tf-keras"]
transnet = [
  "torch",
  "transnetv2-pytorch>=1.0.5",
]
animecv = [
  "torch",
  "torchvision",
  "timm",
  "bounding-box",
  "pycocotools",
  "pyyaml",
  "webcolors",
  "tensorboardX",
  "tqdm",
  "requests",
  "transnetv2-pytorch>=1.0.5",
]
dev = ["ruff>=0.8.0"]

[project.scripts]
autoscene = "autoscene.cli:main"
autoscene-desktop = "autoscene.desktop:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/autoscene"]

[tool.hatch.build.targets.wheel.sources]
"src/autoscene" = "autoscene"
