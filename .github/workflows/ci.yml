name: CI

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Installs the pinned nightly (plus rustfmt/clippy) from rust-toolchain.toml.
      - name: Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The exact, checksum-pinned ffmpeg the app ships with (Homebrew's lacks
      # zimg, which HDR tone mapping needs).
      - name: FFmpeg
        shell: bash
        run: |
          cargo xtask fetch-sidecars
          echo "$PWD/app/src-tauri/ffmpeg" >> "$GITHUB_PATH"
          echo "AUTOSCENE_FFMPEG_DIR=$PWD/app/src-tauri/ffmpeg" >> "$GITHUB_ENV"
      - name: Frontend dist placeholder
        shell: bash
        run: mkdir -p app/dist
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generate fixtures
        run: cargo xtask fixtures
      - run: cargo test --workspace
        env:
          AUTOSCENE_REQUIRE_FIXTURES: "1"
      - name: Bindings are up to date
        shell: bash
        run: |
          cargo run -p autoscene-app --bin export-bindings
          git diff --exit-code app/src/bindings.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run build
