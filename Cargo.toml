[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri", "xtask"]
default-members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.85"
license = "Proprietary"
repository = "https://github.com/tcmmi/AutoScene"
authors = ["tcmmi"]

[workspace.dependencies]
# internal
as-core = { path = "crates/as-core" }
as-api = { path = "crates/as-api" }
as-testkit = { path = "crates/as-testkit" }
as-media = { path = "crates/as-media" }
as-export = { path = "crates/as-export" }

# shared third-party
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
parking_lot = "0.12"
bitflags = { version = "2", features = ["serde"] }
zstd = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "uuid"] }
dirs = "7"

[profile.dev]
# Media/vision code is unusable unoptimised; keep debug info but optimise deps.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
