[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri", "xtask"]
default-members = ["crates/*", "app/src-tauri"]
exclude = ["vendor"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.95"
license = "Proprietary"
repository = "https://github.com/tcmmi/AutoScene"
authors = ["tcmmi"]

[workspace.dependencies]
# internal
as-core = { path = "crates/as-core" }
as-api = { path = "crates/as-api" }
as-testkit = { path = "crates/as-testkit" }
as-media = { path = "crates/as-media" }
as-export = { path = "crates/as-export" }
as-db = { path = "crates/as-db" }
as-jobs = { path = "crates/as-jobs" }
as-project = { path = "crates/as-project" }

# shared third-party
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28", features = ["v7", "serde"] }
tracing = "0.1.44"
parking_lot = "0.12.5"
zstd = "0.14.2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "uuid"] }
dirs = "7.0"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"

[profile.dev]
# Media/vision code is unusable unoptimised; keep debug info but optimise deps.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# tauri-specta only supports Tauri 2 upstream; this copy is ported to Tauri 3 (see vendor/tauri-specta/AUTOSCENE.md).
[patch.crates-io]
tauri-specta = { path = "vendor/tauri-specta" }
